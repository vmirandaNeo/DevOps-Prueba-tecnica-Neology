server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: parking-api
  datasource:
    url: ${DB_URL:jdbc:h2:mem:parking;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: Parking API
    version: 1.0.0

app:
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:4200}

