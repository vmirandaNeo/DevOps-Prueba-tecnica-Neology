spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/parking}
    username: ${DB_USERNAME:parking}
    password: ${DB_PASSWORD:parking_dev_password}
    driver-class-name: org.postgresql.Driver
  h2:
    console:
      enabled: false
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

